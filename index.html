<!DOCTYPE html>
<html lang="ro">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>RO-ALERT · Dashboard</title>
  <meta property="og:title" content="RO-ALERT · Dashboard">
  <meta property="og:description" content="Arhiva mesajelor de avertizare publică RO-ALERT — 3385 de alerte din februarie–august 2026. Hartă, grafice și acces la fiecare mesaj.">
  <meta property="og:image" content="https://lab.gov2.ro/ro-alert/repository/lab.gov2.ro_ro-alert.png">
  <meta property="og:type" content="website">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="description" content="Arhiva mesajelor de avertizare publică RO-ALERT — 3385 de alerte din februarie–august 2026.">
  <link rel="stylesheet" href="vendor/leaflet.css">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <a class="skip-link" id="skip-link" href="#content-main" data-i18n="skip_link">Sari la conținut</a>

  <!-- ===== TOP NAVIGATION ===== -->
  <header class="topnav" id="topnav">
    <div class="topnav-brand">
      <span class="logo" aria-hidden="true">◬</span>
      <h1 class="brand-text">RO-ALERT</h1>
    </div>
    <nav class="topnav-views" id="view-tabs" aria-label="Vizualizări" data-i18n-label="nav_views">
      <button type="button" class="view-tab" data-view="story" data-i18n="view_story">Pe scurt</button>
      <button type="button" class="view-tab active" data-view="dashboard" aria-current="page" data-i18n="view_dashboard">Dashboard</button>
      <button type="button" class="view-tab" data-view="table" data-i18n="view_table">Tabel</button>
      <button type="button" class="view-tab" data-view="feed" data-i18n="view_feed">Feed</button>
      <button type="button" class="view-tab" data-view="location" disabled data-i18n="view_location">Local</button>
    </nav>
    <div class="topnav-controls">
      <span class="daterange" id="daterange-label"></span>
      <button type="button" id="btn-clear-all" class="link-btn" data-i18n="clear_all">Reset</button>
      <div class="langtoggle" id="langtoggle" role="group" aria-label="Limbă" data-i18n-label="lang_group">
        <button type="button" class="lbtn active" data-lang="ro" lang="ro" aria-pressed="true" aria-label="Română">RO</button>
        <button type="button" class="lbtn" data-lang="en" lang="en" aria-pressed="false" aria-label="English">EN</button>
      </div>
    </div>
  </header>

  <!-- ===== SIDEBAR + MAIN ===== -->
  <div class="layout" id="layout">
    <aside class="sidebar" id="sidebar" aria-labelledby="filters-title" tabindex="-1">
      <div class="drawer-head">
        <h2 id="filters-title" tabindex="-1" data-i18n="filters_title">Filtre</h2>
        <button type="button" id="filters-close" class="icon-btn" aria-label="Închide filtrele" data-i18n-label="filters_close"><span aria-hidden="true">&times;</span></button>
      </div>
      <div class="sidebar-body" id="sidebar-body">
        <div class="sidebar-tabs" id="sidebar-tabs">
          <button type="button" class="stab active" data-mode="console" aria-pressed="true" data-i18n="sidebar_console">Consolă</button>
          <button type="button" class="stab" data-mode="briefing" aria-pressed="false" data-i18n="sidebar_briefing">Briefing</button>
        </div>
        <div class="search-wrap">
          <input type="search" id="search" aria-label="Caută în mesaje" data-i18n-label="search_label" data-i18n-ph="search_ph" placeholder="Caută în mesaje…" autocomplete="off">
        </div>
        <div class="date-range" id="date-range"></div>
        <div class="filter-actions">
          <button type="button" id="sidebar-clear" class="link-btn" data-i18n="sidebar_clear">Resetează filtrele</button>
        </div>
        <p class="facet-note" data-i18n="facet_counts_note">Numerele arată toate datele, nu selecția curentă.</p>
        <div id="facets" class="facets"></div>
        <div class="sidebar-stats" id="sidebar-stats"></div>
      </div>
      <div class="drawer-foot">
        <button type="button" id="filters-apply" class="primary-btn"></button>
      </div>
    </aside>

    <div class="main-col" id="main-col">
      <!-- Outside the replaceable view: the count, every active filter, and notices about the link -->
      <div class="resultbar">
        <button type="button" id="open-filters" class="filters-btn" aria-haspopup="dialog" aria-controls="sidebar" aria-expanded="false">
          <span data-i18n="filters_title">Filtre</span><span id="filters-badge" class="filters-badge"></span>
        </button>
        <span id="result-count" class="result-count" role="status" aria-live="polite" aria-atomic="true"></span>
      </div>
      <div class="active-strip" id="active-strip" hidden></div>
      <div class="notices" id="notices" hidden></div>
      <main class="content" id="content-main" tabindex="-1">
        <!-- Rendered by view modules -->
      </main>
    </div>
  </div>

  <!-- ===== DETAIL DIALOG (native modal) ===== -->
  <dialog class="drawer" id="drawer" aria-labelledby="drawer-title">
    <div class="drawer-inner">
      <button type="button" class="drawer-close" id="drawer-close" aria-label="Închide detaliile alertei" data-i18n-label="drawer_close"><span aria-hidden="true">&times;</span></button>
      <div id="drawer-body"></div>
    </div>
  </dialog>

  <!-- ===== SCRIPTS (order matters) ===== -->
  <script src="vendor/leaflet.js"></script>
  <script src="vendor/chart.umd.min.js"></script>
  <!-- embedded data bundles (work under file://, no server needed) -->
  <script src="data/alerts.js"></script>
  <script src="data/meta.js"></script>
  <script src="data/geo.js"></script>
  <script src="js/i18n.js"></script>
  <script src="js/stats.js"></script>
  <script src="js/data.js"></script>
  <script src="js/filters.js"></script>
  <script src="js/urlstate.js"></script>
  <script src="js/charts.js"></script>
  <script src="js/map.js"></script>
  <script src="js/sidebar.js"></script>
  <script src="js/dashboard.js"></script>
  <script src="js/table.js"></script>
  <script src="js/feed.js"></script>
  <script src="js/location.js"></script>
  <script src="js/story.js"></script>
  <script src="js/access.js"></script>
  <script src="js/app.js"></script>

  <footer class="site-footer" id="site-footer"><mark>Proof of Concept</mark> &middot;
    <span data-i18n="footer_source">Surse date:</span>
    <a href="https://data.gov.ro/ro/dataset?q=mesaje+ro-alert&organization=inspectoratul-general-pentru-situatii-de-urgenta" target="_blank" rel="noopener">data.gov.ro · mesaje RO-ALERT · IGSU</a>
    <span class="footer-range" id="footer-range">(februarie – august 2026)</span> · | ·
    <span data-i18n-html="footer_disclaimer">Acesta <b>NU ESTE un proiect oficial al Guvernului României</b>. Date preluate de pe <a href="https://data.gov.ro/ro/dataset?q=mesaje+ro-alert&organization=inspectoratul-general-pentru-situatii-de-urgenta">data.gov.ro / IGSU</a>.</span>
  </footer>
    <script async src="https://scripts.simpleanalyticscdn.com/latest.js"></script>
    <noscript><img src="https://queue.simpleanalyticscdn.com/noscript.gif" alt="" referrerpolicy="no-referrer-when-downgrade"/></noscript>
</body>
</html>
