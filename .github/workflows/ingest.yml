name: ingest

# Scheduled discovery. It needs data.gov.ro. The offline checks run in ci.yml.
on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.2.2

      - uses: actions/setup-python@v5.6.0
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      # ingest.py exits 0 on "no new data" and 1 on a failure. The script keeps both codes.
      - name: Ingest new months from data.gov.ro
        id: ingest
        run: bash tools/ci_ingest.sh

      - name: Rebuild dashboard data
        run: python3 build_data.py

      - name: Detect publishable changes
        id: diff
        run: |
          if [ -n "$(git status --porcelain -- sources data/alerts.js data/meta.js data/geo.js)" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Open pull request
        if: steps.diff.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v7.0.8
        with:
          branch: data/ro-alert-ingest
          title: "data: RO-ALERT ${{ steps.ingest.outputs.months || 'rebuild' }}"
          commit-message: "data: RO-ALERT ${{ steps.ingest.outputs.months || 'rebuild' }}"
          body: ${{ steps.ingest.outputs.body }}
          add-paths: |
            sources/
            data/alerts.js
            data/meta.js
            data/geo.js
